<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modules – Social Coding LMS</title>
    <link rel="stylesheet" href="shared-theme.css">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="theme-color" content="var(--accent-purple)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        .mod-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:14px; padding:1.5rem; margin-bottom:1.25rem; }
        .mod-head { display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; flex-wrap:wrap; margin-bottom:0.75rem; }
        .mod-title { font-size:1.25rem; font-weight:700; margin-top:0.35rem; }
        .lesson-block { border-top:1px solid var(--divider); padding:0.9rem 0 0.4rem; margin-top:0.75rem; }
        .lesson-title { font-weight:600; margin-bottom:0.5rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
        .kind-icon { width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; background:var(--tint-2); flex-shrink:0; }
    </style>
</head>
<body>
<div class="bg-glow bg-glow-1"></div><div class="bg-glow bg-glow-2"></div>
<header>
    <div class="header-content">
        <a class="brand" href="/facilitator-dashboard.html"><div class="brand-icon"><img src="/icons/logo-mark-white.png" alt="Social Coding"></div><div><div class="brand-text">Social Coding LMS</div><div class="brand-sub">Facilitator</div></div></a>
        <div class="header-right">
            <nav class="nav-links">
                <a class="nav-link" href="/facilitator-dashboard.html">Home</a>
                <a class="nav-link" href="/facilitator-students.html">Learners</a>
                <a class="nav-link" href="/facilitator-attendance.html">Attendance</a>
                <a class="nav-link" href="/facilitator-assignments.html">Assignments</a>
                <a class="nav-link active" href="/facilitator-modules.html">Modules</a>
            </nav>
            <label class="theme-toggle"><span id="themeIcon" class="theme-label">Dark</span><div class="toggle-track" onclick="toggleTheme()"><div class="toggle-thumb"></div></div></label>
            <div style="display:flex;align-items:center;gap:0.6rem;"><div class="avatar" id="userAvatar">SM</div><div><div class="user-name" id="userName"></div><div class="user-meta" id="userMeta"></div></div></div>
            <button class="btn btn-sm" onclick="openPasswordModal()">Password</button>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>
</header>
<main>
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:1rem;">
        <div>
            <div class="page-title">Modules & Materials</div>
            <div class="page-subtitle">The curriculum and its materials are set by head office, so every school teaches the same content. Open any material to use it in a session.</div>
        </div>
    </div>
    <div class="filter-bar">
        <select class="filter-select" id="modFilter" onchange="renderModules()">
            <option value="">All courses</option>
        </select>
        <input class="filter-search" id="matSearch" placeholder="Search materials…" oninput="renderModules()">
        <span class="filter-count" id="modCount"></span>
    </div>
    <div id="modules"><div style="font-family:'Inter',sans-serif;color:var(--text-secondary);">Loading…</div></div>
</main>

</div>
<nav class="bottom-nav">
    <a href="/facilitator-dashboard.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></svg></span><span class="nav-label">Home</span></a>
    <a href="/facilitator-students.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.2 2.4-5.2 5.5-5.2s5.5 2 5.5 5.2"/><path d="M16 5.6a3 3 0 0 1 0 5.4"/><path d="M17.6 14.9c1.9.6 3 2.3 3 5.1"/></svg></span><span class="nav-label">Learners</span></a>
    <a href="/facilitator-attendance.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/><path d="M9 15l2 2 4-4"/></svg></span><span class="nav-label">Attend</span></a>
    <a href="/facilitator-assignments.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4.5" width="14" height="16" rx="2"/><path d="M9 4.5V3.2h6v1.3"/><path d="M8.5 10h7M8.5 13.5h7M8.5 17h4"/></svg></span><span class="nav-label">Work</span></a>
    <a href="/facilitator-modules.html" class="active"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="M3 14l9 5 9-5"/></svg></span><span class="nav-label">Modules</span></a>
</nav>
<div class="toast" id="toast"><span id="toastMsg"></span></div>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
   let currentLessonId = null;

    let allMods = [];
    function visibleMods() {
        const code = document.getElementById('modFilter')?.value || '';
        const q = (document.getElementById('matSearch')?.value || '').trim().toLowerCase();
        let mods = allMods.filter(m => !code || m.code === code);
        if (q) mods = mods.map(m => ({ ...m, lessons: m.lessons.map(l => ({ ...l,
                    materials: l.materials.filter(mat => (mat.title||'').toLowerCase().includes(q)) }))
                    .filter(l => l.materials.length) })).filter(m => m.lessons.length);
        const n = mods.reduce((t,m)=>t+m.lessons.reduce((x,l)=>x+l.materials.length,0),0);
        const c = document.getElementById('modCount');
        if (c) c.textContent = `${mods.length} course${mods.length===1?'':'s'} · ${n} material${n===1?'':'s'}`;
        return mods;
    }
    function renderModules() { paint(); }

    function paint() {
        const KIND = { slides:'Slides', document:'Document', link:'Link', video:'Video' };
        document.getElementById('modules').innerHTML = visibleMods().map(m => `
            <div class="mod-card">
                <div class="mod-head">
                    <div>
                        <span class="module-chip">${m.code}</span>
                        <div class="mod-title">${m.title}</div>
                        <div style="font-family:'Inter',sans-serif;font-size:0.85rem;color:var(--text-secondary);">${m.description||''}</div>
                    </div>
                </div>
                <div class="table-wrap" style="margin-top:0.9rem;">
                    <table class="data">
                        <thead><tr><th>Lesson</th><th>Material</th><th>Type</th><th class="num">Size</th><th>Uploaded by</th><th></th></tr></thead>
                        <tbody>
                        ${m.lessons.flatMap(l => l.materials.length
                            ? l.materials.map(mat => `
                                <tr>
                                    <td class="muted">${l.lesson_order}. ${l.title}</td>
                                    <td class="strong">${mat.title}</td>
                                    <td>${KIND[mat.kind]||mat.kind}</td>
                                    <td class="num">${mat.file_size_kb?mat.file_size_kb+' KB':'—'}</td>
                                    <td class="muted">${mat.uploaded_by_name||''}</td>
                                    <td class="num"><div class="row-actions">
                                        <a class="btn btn-sm" style="text-decoration:none;" href="${apiUrl('/api/materials/'+mat.id+'/download?token='+getToken())}" target="_blank">Open</a>
                                    </div></td>
                                </tr>`)
                            : [`<tr><td class="muted">${l.lesson_order}. ${l.title}</td><td colspan="5" class="muted">No materials yet</td></tr>`]
                        ).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`).join('');
    }

    function buildModFilter() {
        const sel = document.getElementById('modFilter');
        if (!sel || sel.options.length > 1) return;
        sel.innerHTML = '<option value="">All courses</option>' +
            allMods.map(m => `<option value="${m.code}">${m.code} · ${m.title}</option>`).join('');
    }

    async function load() {
        requireAuth('facilitator');
        populateHeader();
        const mods = await apiFetch('/api/modules');
        allMods = Array.isArray(mods) ? mods : [];
        if (!Array.isArray(mods)) return;
        buildModFilter();
        paint();
    }





    document.addEventListener('DOMContentLoaded', () => { initTheme(); load(); });
    document.addEventListener('click', e => { if (e.target.classList.contains('modal')) e.target.classList.remove('open'); });
</script>
</body>
</html>
