<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in – Social Coding LMS</title>
    <link rel="stylesheet" href="shared-theme.css">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="theme-color" content="var(--accent-purple)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
       body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
        .login-wrap { position:relative; z-index:10; width:100%; max-width:440px; padding:2rem; }
        .brand-center { text-align:center; margin-bottom:2rem; }
        .brand-lockup { width:min(300px,72vw); height:auto; margin:0 auto 0.9rem; display:block; }
        .brand-logo { width:64px; height:64px; background:var(--accent-purple); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:1.8rem; margin:0 auto 1rem; box-shadow:0 8px 32px var(--tint-line); color:var(--bg-grad-start); }
        .brand-name { font-size:2rem; font-weight:700; background:linear-gradient(135deg,var(--text-primary) 0%,var(--accent-purple) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .brand-tag  { font-family:'Inter',sans-serif; color:var(--text-secondary); font-size:0.88rem; margin-top:0.2rem; }
        .login-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:20px; padding:2.5rem; backdrop-filter:blur(20px); }
        .card-title { font-size:1.6rem; font-weight:600; margin-bottom:0.3rem; }
        .card-sub   { font-family:'Inter',sans-serif; color:var(--text-secondary); font-size:0.88rem; margin-bottom:1.75rem; }
        .role-tabs  { display:flex; background:rgba(0,0,0,0.2); border-radius:10px; padding:4px; margin-bottom:1.75rem; gap:2px; }
        [data-theme="light"] .role-tabs { background:rgba(0,0,0,0.06); }
        .role-tab   { flex:1; padding:0.55rem; border:none; background:transparent; color:var(--text-secondary); font-family:'Inter',sans-serif; font-size:0.8rem; font-weight:600; border-radius:7px; cursor:pointer; transition:all 0.2s; text-transform:uppercase; letter-spacing:0.05em; }
        .role-tab.active { background:var(--accent-purple); color:var(--bg-grad-start); box-shadow:0 2px 12px var(--tint-line); }
        .error-box { display:none; background:rgba(248,113,113, 0.12); border:1px solid rgba(248,113,113, 0.25); border-radius:8px; padding:0.75rem 1rem; font-family:'Inter',sans-serif; font-size:0.85rem; color:var(--accent-red); margin-bottom:1rem; }
        .error-box.show { display:block; }
        .btn-login  { width:100%; padding:0.95rem; background:var(--accent-purple); border:none; border-radius:10px; color:var(--bg-grad-start); font-family:'Inter',sans-serif; font-size:1rem; font-weight:700; cursor:pointer; transition:all 0.3s; box-shadow:var(--shadow-btn); margin-top:0.5rem; }
        .btn-login:hover { transform:translateY(-1px); }
        .btn-login:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
        .footer-note { text-align:center; margin-top:1.5rem; font-family:'Inter',sans-serif; font-size:0.78rem; color:var(--text-muted); }
        .theme-corner { position:fixed; top:1.25rem; right:1.5rem; z-index:20; }
        .id-hint { font-family:'Inter',sans-serif; font-size:0.74rem; color:var(--text-muted); margin-top:0.35rem; }
    </style>
</head>
<body>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<div class="theme-corner">
    <label class="theme-toggle">
        <span id="themeIcon" class="theme-label">Dark</span>
        <div class="toggle-track" onclick="toggleTheme()"><div class="toggle-thumb"></div></div>
    </label>
</div>

<div class="login-wrap">
    <div class="brand-center">
        <img class="brand-lockup logo-white" src="/icons/logo-full-white.png" alt="Social Coding">
        <img class="brand-lockup logo-dark"  src="/icons/logo-full-dark.png"  alt="Social Coding">
        <div class="brand-tag">Learner Management System</div>
    </div>

    <div class="login-card">
        <div class="card-title">Welcome back</div>
        <div class="card-sub">Sign in to continue</div>

        <div class="role-tabs">
            <button class="role-tab active" onclick="setRole('student',this)">Learner</button>
            <button class="role-tab"        onclick="setRole('facilitator',this)">Facilitator</button>
            <button class="role-tab"        onclick="setRole('admin',this)">Admin</button>
        </div>

        <div class="error-box" id="errorBox"></div>

        <div class="form-group">
            <label class="form-label" id="idLabel">Student number</label>
            <input type="text" class="form-input" id="loginId" placeholder="SC-2025-0001" autocomplete="username">
            <div class="id-hint" id="idHint">Your Social Coding student number, e.g. SC-2025-0001</div>
        </div>
        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" id="password" placeholder="Enter your password" autocomplete="current-password">
        </div>

        <button class="btn-login" id="loginBtn" onclick="handleLogin()">Sign in</button>
        <p class="footer-note">Forgot your password? Ask your facilitator or school coordinator. <span id="demoDot" onclick="switchDataset()" title="" style="opacity:0.25;cursor:pointer;font-size:9px;user-select:none;">◦</span></p>
    </div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
   let selectedRole = 'student';
    const idCopy = {
        student:     ['Student number', 'SC-2025-0001', 'Your Social Coding student number, e.g. SC-2025-0001'],
        facilitator: ['Employee ID',    'FAC-001',      'Your facilitator ID, e.g. FAC-001'],
        admin:       ['Employee ID',    'ADM-001',      'Your staff ID, e.g. ADM-001'],
    };

    function setRole(role, btn) {
        selectedRole = role;
        document.querySelectorAll('.role-tab').forEach(t =>t.classList.remove('active'));
        btn.classList.add('active');
        const [label, ph, hint] = idCopy[role];
        document.getElementById('idLabel').textContent = label;
        document.getElementById('loginId').placeholder = ph;
        document.getElementById('idHint').textContent = hint;
        document.getElementById('errorBox').classList.remove('show');
    }

    async function handleLogin() {
        const login_id = document.getElementById('loginId').value.trim();
        const password = document.getElementById('password').value;
        const errBox = document.getElementById('errorBox');
        const btn = document.getElementById('loginBtn');

        errBox.classList.remove('show');
        if (!login_id || !password) {
            errBox.textContent = 'Enter your ' + idCopy[selectedRole][0].toLowerCase() + ' and password.';
            errBox.classList.add('show'); return;
        }

        btn.disabled = true; btn.textContent = 'Signing in…';
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST', headers: { 'Content-Type':'application/json' },
                body: JSON.stringify({ login_id, password })
            });
            const data = await res.json();
            if (!res.ok) { errBox.textContent = data.error || 'Sign-in failed.'; errBox.classList.add('show'); return; }
            if (data.user.role !== selectedRole) {
                errBox.textContent = `This account is a ${data.user.role}. Select the correct tab above.`;
                errBox.classList.add('show'); return;
            }
            saveAuth(data.token, data.user);
            const map = { student:'/student-dashboard.html', facilitator:'/facilitator-dashboard.html', admin:'/admin-dashboard.html' };
            window.location.href = map[data.user.role];
        } catch {
            errBox.textContent = 'Cannot reach the server. If you are offline, previously signed-in facilitators can still open Attendance from their home screen.';
            errBox.classList.add('show');
        } finally { btn.disabled = false; btn.textContent = 'Sign in'; }
    }

    // Hidden dataset switch (the tiny dot): OK = full demo data, then Cancel on the
    // second dialog = restore starter data. Documented in HOW_TO_RUN.md.
    async function switchDataset() {
        if (!confirm('Switch the dataset? This replaces ALL current data.')) return;
        const demo = confirm('OK = reload the FULL dataset (10 schools, 180 learners, 10 facilitators)\nCancel = load a SMALL starter set (1 school, 2 learners) for quick testing');
        try {
            const res = await fetch('/api/dev/reseed', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ profile: demo ? 'demo' : 'lean' })
            });
            const data = await res.json();
            alert(data.message || data.error || 'Done.');
        } catch { alert('Could not reach the server.'); }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
    document.addEventListener('DOMContentLoaded', () => {
        initTheme();
        const user = getUser();
        if (user && getToken()) {
            const map = { student:'/student-dashboard.html', facilitator:'/facilitator-dashboard.html', admin:'/admin-dashboard.html' };
            window.location.href = map[user.role] || '/login.html';
        }
    });
</script>
</body>
</html>
