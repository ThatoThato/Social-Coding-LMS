# Netlify config — for hosting the FRONTEND ONLY as a static site.
# The Express API must run elsewhere (e.g. Render); set window.SC_API_BASE
# in frontend/config.js to that server's URL before deploying.
[build]
  publish = "frontend"

# The service worker must never be cached, or phones keep an old app shell.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[redirects]]
  from = "/"
  to = "/login.html"
  status = 302
